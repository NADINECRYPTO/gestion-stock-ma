name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: APK de test (debug)
        run: ./gradlew --no-daemon assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk GestionStockMA-test.apk
      - uses: actions/upload-artifact@v4
        with: { name: GestionStockMA-debug-apk, path: GestionStockMA-test.apk }
      - name: Publier en Release (téléchargement direct)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete test-latest -y --cleanup-tag || true
          gh release create test-latest GestionStockMA-test.apk --prerelease -t "APK de test" -n "Build ${{ github.sha }}"
      - name: Copier l'APK sur la branche apk
        run: |
          mkdir /tmp/out && cp GestionStockMA-test.apk /tmp/out/ && cd /tmp/out
          git init -q -b apk && git add . && git -c user.name=ci -c user.email=ci@local commit -qm "APK ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk
